# Supabase 免费项目保活
#
# 免费版项目连续 7 天没有数据库活动会被自动暂停，
# 暂停时项目域名（xxx.supabase.co）也会被移除，
# 网页就会报 "Failed to fetch"。
#
# 这个 workflow 每天对 user_settings 表做一次只读查询，
# 产生一次真实的数据库活动，从而避免被暂停。
#
# 注意：GitHub 会在仓库连续 60 天没有提交后自动停用定时任务，
# 到 Actions 页面点 "Enable workflow" 即可重新启用。

name: Supabase Keep Alive

on:
  schedule:
    # UTC 03:00 = 北京时间 11:00，每天一次
    - cron: "0 3 * * *"
  # 允许在 Actions 页面手动触发，方便验证
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL: https://wqcxdnitppkaccbzwbjj.supabase.co
      # publishable / anon key，本来就在 js/config.js 里公开，不增加风险
      SUPABASE_KEY: sb_publishable_G7NvaEI9mkuim_0QHkphSQ_EtNgvHYC

    steps:
      - name: Query user_settings 表（只读，不修改数据）
        run: |
          set -euo pipefail

          echo "时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "目标：$SUPABASE_URL/rest/v1/user_settings"

          status=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -m 30 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Accept: application/json" \
            "$SUPABASE_URL/rest/v1/user_settings?select=id&limit=1")

          echo "HTTP 状态码：$status"
          echo "响应：$(head -c 500 /tmp/resp.txt)"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::保活查询失败，HTTP $status（项目可能已被暂停或 key 已失效）"
            exit 1
          fi

          echo "✅ 数据库活动已产生，保活成功"
