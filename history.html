<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

    <meta name="theme-color" content="#f5f5f5">

    <title>历史记录 - 我的私人哑铃训练</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/loading.css">

    <link rel="stylesheet" href="css/history.css">


</head>


<body>


    <div class="container">


        <!-- =====================================================
             页面标题
        ====================================================== -->

        <div class="page-header">


            <div class="page-title">

                <h1>
                    📚 历史记录
                </h1>

                <p id="today" class="muted"></p>

            </div>


        </div>



        <!-- =====================================================
             历史分类导航
        ====================================================== -->

        <div class="history-nav">


            <button type="button" class="active" onclick="showHistorySection('workoutHistorySection', this)">

                🏋️ 力量训练

            </button>


            <button type="button" onclick="showHistorySection('bodyMetricsHistorySection', this)">

                📏 身体数据

            </button>


        </div>



        <!-- =====================================================
             力量训练历史
        ====================================================== -->

        <section id="workoutHistorySection" class="history-section">


            <div class="card">


                <h2>
                    🏋️ 力量训练历史
                </h2>


                <div id="historyList"></div>

                <button id="loadMoreWorkoutsButton" type="button" class="secondary-btn history-load-more"
                    onclick="loadMoreWorkouts()">
                    加载更多
                </button>


            </div>


        </section>


        <!-- =====================================================
             身体数据历史
        ====================================================== -->

        <section id="bodyMetricsHistorySection" class="history-section hidden">


            <div class="card">


                <h2>
                    📏 身体数据历史
                </h2>

                <div id="bodyMetricsHistoryList"></div>

                <button id="loadMoreBodyMetricsButton" type="button" class="secondary-btn history-load-more"
                    onclick="loadMoreBodyMetrics()">
                    加载更多
                </button>


            </div>

</section>


        <!-- =====================================================
     底部主导航
     与首页保持完全一致
====================================================== -->

        <nav class="bottom-nav">


            <!-- ================================
            首页
            ================================= -->

            <a href="index.html" class="bottom-nav-item">

                <span class="bottom-nav-icon">
                    🏠
                </span>

                <span class="bottom-nav-label">
                    首页
                </span>

            </a>


            <!-- ================================
            训练计划
            ================================= -->

            <a href="cycle-plan.html" class="bottom-nav-item">

                <span class="bottom-nav-icon">
                    🔁
                </span>

                <span class="bottom-nav-label">
                    训练计划
                </span>

            </a>

            <!-- ================================
            训练统计
            ================================= -->

            <a href="metrics.html" class="bottom-nav-item">

                <span class="bottom-nav-icon">
                    📏
                </span>

                <span class="bottom-nav-label">
                    身体数据
                </span>

            </a>


            <a href="analysis.html" class="bottom-nav-item">

                <span class="bottom-nav-icon">
                    📊
                </span>

                <span class="bottom-nav-label">
                    统计
                </span>

            </a></nav>




        <!-- =====================================================
     页面底部
====================================================== -->

        <div class="footer">

            私人哑铃增肌 / 塑形训练系统

        </div>




    </div>




    <!-- =====================================================
     History 页面 JavaScript
====================================================== -->

    <script src="js/config.js"></script>

    <script src="js/loading.js"></script>

    <script src="js/api.js"></script>

    <script src="js/v4-core.js"></script>

    <script src="js/history.js"></script>





</body>

</html>
