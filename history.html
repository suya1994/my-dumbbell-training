<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

    <meta name="theme-color" content="#f5f5f5">

    <title>历史记录 - 我的私人哑铃训练</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/history.css">


</head>


<body>


    <div class="container">


        <!-- =====================================================
             页面标题
        ====================================================== -->

        <div class="page-header">


            <div class="page-title">

                <h1>
                    📚 历史记录
                </h1>

                <p id="today" class="muted"></p>

            </div>


        </div>



        <!-- =====================================================
             历史分类导航
        ====================================================== -->

        <div class="history-nav">


            <button type="button" class="active" onclick="showHistorySection('workoutHistorySection', this)">

                🏋️ 力量训练

            </button>


            <button type="button" onclick="showHistorySection('otherActivityHistorySection', this)">

                🏃 其它运动

            </button>


            <button type="button" onclick="showHistorySection('stepsHistorySection', this)">

                👟 步数

            </button>


        </div>



        <!-- =====================================================
             力量训练历史
        ====================================================== -->

        <section id="workoutHistorySection" class="history-section">


            <div class="card">


                <h2>
                    🏋️ 力量训练历史
                </h2>


                <div id="historyList">

                    <div class="muted">

                        正在读取力量训练历史……

                    </div>

                </div>


            </div>


        </section>



        <!-- =====================================================
             其它运动历史
        ====================================================== -->

        <section id="otherActivityHistorySection" class="history-section hidden">


            <div class="card">


                <h2>
                    🏃 其它运动历史
                </h2>


                <div id="otherActivityList">

                    <div class="muted">

                        正在读取其它运动……

                    </div>

                </div>


            </div>


        </section>



        <!-- =====================================================
             步数历史
        ====================================================== -->

        <section id="stepsHistorySection" class="history-section hidden">


            <div class="card">


                <h2>
                    👟 步数历史
                </h2>


                <div id="dailyStepsHistory">

                    <div class="muted">

                        正在读取步数……

                    </div>

                </div>


            </div>


        </section>





        <!-- =====================================================
     底部主导航
     与首页保持完全一致
====================================================== -->

        <nav class="bottom-nav">


            <!-- ================================
         首页
    ================================= -->

            <a href="index.html" class="bottom-nav-item">

                <span class="bottom-nav-icon">
                    🏠
                </span>

                <span class="bottom-nav-label">
                    首页
                </span>

            </a>


            <!-- ================================
         身体数据
    ================================= -->

            <a href="metrics.html" class="bottom-nav-item">

                <span class="bottom-nav-icon">
                    📏
                </span>

                <span class="bottom-nav-label">
                    身体
                </span>

            </a>


            <!-- ================================
         训练统计
    ================================= -->

            <a href="analysis.html" class="bottom-nav-item">

                <span class="bottom-nav-icon">
                    📊
                </span>

                <span class="bottom-nav-label">
                    统计
                </span>

            </a>


            <!-- ================================
         历史记录
    ================================= -->

            <a href="history.html" class="bottom-nav-item active">

                <span class="bottom-nav-icon">
                    📚
                </span>

                <span class="bottom-nav-label">
                    历史
                </span>

            </a>


        </nav>


        <!-- =====================================================
     页面底部
====================================================== -->

        <div class="footer">

            私人哑铃增肌 / 塑形训练系统

        </div>




    </div>




    <!-- =====================================================
     History 页面 JavaScript
====================================================== -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/history.js"></script>





</body>

</html>
