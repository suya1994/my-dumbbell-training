<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

    <meta name="theme-color" content="#f5f5f5">

    <title>身体数据 - 我的私人哑铃训练</title>

    <!-- 公共页面样式 -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/loading.css">

    <!-- 身体数据页面专属样式 -->

    <link rel="stylesheet" href="css/metrics.css">

</head>


<body>


    <div class="container">


        <!-- =====================================================
        页面标题
        ====================================================== -->

        <div class="header">

            <div class="header-top">

                <div class="header-title">

                    <h1>
                        📏 身体数据
                    </h1>

                    <p id="today"></p>

                </div>


            </div>

        </div>



        <!-- =====================================================
        今日身体数据
        ====================================================== -->

        <div class="card">

            <h2>
                📏 今日身体数据
            </h2>

            <div class="muted">

                建议每周固定一天，
                早晨空腹记录，方便观察真实变化。

            </div>

            <div class="metric-form">


                <!-- 体重 -->

                <div class="metric-field">

                    <label for="metricWeight">
                        体重 kg
                    </label>

                    <input id="metricWeight" class="note" type="number" step="0.1" min="0" placeholder="例如 52.0">

                </div>


                <!-- 腰围 -->

                <div class="metric-field">

                    <label for="metricWaist">
                        腰围 cm
                    </label>

                    <input id="metricWaist" class="note" type="number" step="0.1" min="0" placeholder="例如 68.0">

                </div>


                <!-- 臀围 -->

                <div class="metric-field">

                    <label for="metricHip">
                        臀围 cm
                    </label>

                    <input id="metricHip" class="note" type="number" step="0.1" min="0" placeholder="例如 91.0">

                </div>


            </div>


            <button type="button" class="primary-btn" onclick="saveBodyMetrics()">

                💾 保存今天身体数据

            </button>

        </div>



        <!-- =====================================================
        本月变化
        ====================================================== -->

        <div class="card">

            <h2>
                📊 本月变化
            </h2>

            <div class="muted">

                本月平均只计算实际记录过的数据。
                没有记录的项目不会按 0 参与计算。

            </div>


            <!-- =================================================
            本月平均
            ================================================== -->

            <div class="metric-section">

                <div class="metric-section-title">
                    本月平均
                </div>


                <div class="metric-summary-grid">


                    <!-- 体重 -->

                    <div class="metric-summary-item">

                        <div class="metric-summary-label">
                            体重
                        </div>

                        <div>
                            <strong id="monthlyAverageWeight" class="metric-summary-number">

                                —

                            </strong>

                            <span class="metric-summary-unit">
                                kg
                            </span>
                        </div>

                    </div>


                    <!-- 腰围 -->

                    <div class="metric-summary-item">

                        <div class="metric-summary-label">
                            腰围
                        </div>

                        <div>
                            <strong id="monthlyAverageWaist" class="metric-summary-number">

                                —

                            </strong>

                            <span class="metric-summary-unit">
                                cm
                            </span>
                        </div>

                    </div>


                    <!-- 臀围 -->

                    <div class="metric-summary-item">

                        <div class="metric-summary-label">
                            臀围
                        </div>

                        <div>
                            <strong id="monthlyAverageHip" class="metric-summary-number">

                                —

                            </strong>

                            <span class="metric-summary-unit">
                                cm
                            </span>
                        </div>

                    </div>


                </div>

            </div>



            <!-- =================================================
            相比月初
            ================================================== -->



            <div class="metric-section">

                <div class="metric-section-title">
                    相比月初
                </div>


                <div id="monthlyChangeSummary" class="metric-summary-grid">


                    <!-- ================================
        体重
        ================================= -->

                    <div class="metric-summary-item">

                        <div class="metric-summary-label">
                            体重
                        </div>

                        <div>
                            <strong id="monthlyChangeWeight" class="metric-summary-number">
                                —
                            </strong>

                            <span class="metric-summary-unit">
                                kg
                            </span>
                        </div>

                    </div>


                    <!-- ================================
        腰围
        ================================= -->

                    <div class="metric-summary-item">

                        <div class="metric-summary-label">
                            腰围
                        </div>

                        <div>
                            <strong id="monthlyChangeWaist" class="metric-summary-number">
                                —
                            </strong>

                            <span class="metric-summary-unit">
                                cm
                            </span>
                        </div>

                    </div>


                    <!-- ================================
        臀围
        ================================= -->

                    <div class="metric-summary-item">

                        <div class="metric-summary-label">
                            臀围
                        </div>

                        <div>
                            <strong id="monthlyChangeHip" class="metric-summary-number">
                                —
                            </strong>

                            <span class="metric-summary-unit">
                                cm
                            </span>
                        </div>

                    </div>


                </div>

            </div>

            <!-- =================================================
相比上月平均值
================================================== -->

            <div class="metric-section">

                <div class="metric-section-title">
                    相比上月平均值
                </div>


                <div id="monthlyPreviousAverageSummary" class="metric-summary-grid">


                    <!-- ================================
        体重
        ================================= -->

                    <div class="metric-summary-item">

                        <div class="metric-summary-label">
                            体重
                        </div>

                        <div>
                            <strong id="monthlyPreviousAverageWeight" class="metric-summary-number">
                                —
                            </strong>

                            <span class="metric-summary-unit">
                                kg
                            </span>
                        </div>

                    </div>


                    <!-- ================================
        腰围
        ================================= -->

                    <div class="metric-summary-item">

                        <div class="metric-summary-label">
                            腰围
                        </div>

                        <div>
                            <strong id="monthlyPreviousAverageWaist" class="metric-summary-number">
                                —
                            </strong>

                            <span class="metric-summary-unit">
                                cm
                            </span>
                        </div>

                    </div>


                    <!-- ================================
        臀围
        ================================= -->

                    <div class="metric-summary-item">

                        <div class="metric-summary-label">
                            臀围
                        </div>

                        <div>
                            <strong id="monthlyPreviousAverageHip" class="metric-summary-number">
                                —
                            </strong>

                            <span class="metric-summary-unit">
                                cm
                            </span>
                        </div>

                    </div>


                </div>

            </div>

        </div>



        <!-- =====================================================
        月度变化
        ====================================================== -->

        <div class="card">

            <h2>
                📈 月度变化
            </h2>

            <div class="muted">

                按月份观察身体数据的长期变化。
                每个月使用实际记录数据计算平均值。

            </div>


            <div class="metric-switcher">


                <button type="button" id="monthlyMetricWeightButton" class="metric-switch-btn active"
                    onclick="switchMonthlyMetric('weight')">

                    体重

                </button>


                <button type="button" id="monthlyMetricWaistButton" class="metric-switch-btn"
                    onclick="switchMonthlyMetric('waist')">

                    腰围

                </button>


                <button type="button" id="monthlyMetricHipButton" class="metric-switch-btn"
                    onclick="switchMonthlyMetric('hip')">

                    臀围

                </button>


            </div>


            <div class="metric-chart-container metric-monthly-chart">

                <canvas id="monthlyTrendChart"></canvas>

            </div>

        </div>



        <!-- =====================================================
        最近身体数据
        ====================================================== -->

        <div class="card">

            <h2>
                📝 最近身体数据
            </h2>

            <div class="muted">

                最近记录只在这里预览。
                完整身体数据历史统一放在「历史记录」。

            </div>


            <div id="metricsHistory">

                <div class="muted">
                    正在读取身体数据……
                </div>

            </div>


            <button type="button" class="secondary-btn" onclick="window.location.href='history.html'">

                📚 查看全部身体历史

            </button>

        </div>


    </div>



    <!-- =====================================================
    底部主导航
    ====================================================== -->

    <nav class="bottom-nav">


        <a href="index.html" class="bottom-nav-item">

            <span class="bottom-nav-icon">
                🏠
            </span>

            <span class="bottom-nav-label">
                首页
            </span>

        </a>


        <a href="metrics.html" class="bottom-nav-item active">

            <span class="bottom-nav-icon">
                📏
            </span>

            <span class="bottom-nav-label">
                身体
            </span>

        </a>


        <a href="analysis.html" class="bottom-nav-item">

            <span class="bottom-nav-icon">
                📊
            </span>

            <span class="bottom-nav-label">
                统计
            </span>

        </a>


        <a href="history.html" class="bottom-nav-item">

            <span class="bottom-nav-icon">
                📚
            </span>

            <span class="bottom-nav-label">
                历史
            </span>

        </a>


    </nav>



    <!-- =====================================================
    JavaScript
    ====================================================== -->

    <script src="js/config.js"></script>

    <script src="js/loading.js"></script>

    <script src="js/api.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/metrics.js"></script>


</body>

</html>
