<!DOCTYPE html>
<html lang="zh-CN">

<head>

     <meta charset="UTF-8">

     <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

     <meta name="theme-color" content="#f5f5f5">

     <title>我的私人哑铃训练</title>

     <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/loading.css">

</head>


<body>


     <div class="container">


          <!-- =====================================================
          页面标题
          ====================================================== -->

          <div class="header">

               <div class="header-top">

                    <div class="header-title">

                         <h1>
                              🏋️ 我的私人哑铃训练
                         </h1>

                         <p id="today"></p>

                         <p id="trainingCompletedCount" class="muted">

                              默认从 A 开始，按 A → B → A 循环

                         </p>

                         <h2 id="nextTrainingTitle">

                              下一次训练计划

                         </h2>

                         <p id="nextTrainingExpected" class="muted">

                              正在读取训练计划……

                         </p>

                    </div>


                    <button type="button" class="header-settings" onclick="window.location.href='exercises.html'"
                         aria-label="动作库" title="动作库">
                         💪
                    </button>

                    <button type="button" class="header-settings" onclick="window.location.href='history.html'"
                         aria-label="历史记录" title="历史记录">
                         📚
                    </button>

                    <button type="button" class="header-settings" onclick="window.location.href='backup.html'"
                         aria-label="备份" title="备份">
                         💾
                    </button>

               </div>

          </div>



          <!-- =====================================================
          数据库连接状态
          ====================================================== -->

          <div id="connectionStatus" class="status">

               正在连接训练数据库……

          </div>



          <div id="trainingPlanActions" class="status hidden"></div>



          <!-- =====================================================
          首页 Tab
          ====================================================== -->

          <div class="tabs">


               <!-- ================================
               今日
               ================================= -->

               <button class="tab active" onclick="showTab('todayTab',this)">

                    今日

               </button>


               <!-- ================================
               AI教练
               ================================= -->

               <button class="tab" onclick="showTab('aiTab',this)">

                    🤖 AI教练

               </button>

          </div>



          <!-- =====================================================
          今日
          ====================================================== -->

          <section id="todayTab">


               <!-- ================================
               今日训练计划
               ================================= -->

               <div id="todayPlan" class="card">

                    <div id="todayPlanContent">

                         <div class="loading">

                              正在读取今日训练计划……

                         </div>

                    </div>

               </div>



               <div class="card">

                    <h2>
                         📝 本次训练
                    </h2>

                    <div class="muted">
                         在上方为每个动作标记“完成/未完成”。完成本次训练后，下一次将自动切换到下一计划（A → B → A）。
                    </div>

                    <br>

                    <button id="saveButton" class="primary-btn" onclick="completeCurrentHomePlan()" disabled>
                         完成本次训练
                    </button>

               </div>

          </section>



          <!-- =====================================================
          AI私人教练
          ====================================================== -->

          <!-- =====================================================
          AI排课（简化版）
          ====================================================== -->

          <section id="aiTab" class="hidden">

               <div class="card">
                    <h2>🤖 AI教练</h2>
                    <div class="muted">选择一个训练计划，生成该计划的总结并复制给 AI。</div>
               </div>

               <div class="card">
                    <h2>训练计划</h2>
                    <div id="aiPlanList">
                         <div class="loading">正在读取训练计划……</div>
                    </div>
               </div>

               <div class="card">
                    <h2>计划总结</h2>
                    <div id="aiPlanSummaryEmpty" class="muted">请先在上方点击一个训练计划。</div>
                    <textarea id="aiPlanSummary" class="note hidden" rows="16" readonly></textarea>
                    <br><br>
                    <button id="aiCopyPlanSummaryBtn" type="button" class="primary-btn" onclick="copyAIPlanSummary()" disabled>
                         📋 复制计划总结
                    </button>
               </div>

          </section>

     </div>



     <!-- =====================================================
     底部主导航
     ====================================================== -->

     <nav class="bottom-nav">


          <!-- ================================
          首页
          ================================= -->

          <a href="index.html" class="bottom-nav-item active">

               <span class="bottom-nav-icon">
                    🏠
               </span>

               <span class="bottom-nav-label">
                    首页
               </span>

          </a>


          <!-- ================================
          训练计划
          ================================= -->

          <a href="cycle-plan.html" class="bottom-nav-item">

               <span class="bottom-nav-icon">
                    🔁
               </span>

               <span class="bottom-nav-label">
                    训练计划
               </span>

          </a>

          <!-- ================================
          训练统计
          ================================= -->

          <a href="metrics.html" class="bottom-nav-item">

              <span class="bottom-nav-icon">
                  📏
              </span>

              <span class="bottom-nav-label">
                  身体数据
              </span>

          </a>


          <a href="analysis.html" class="bottom-nav-item">

              <span class="bottom-nav-icon">
                  📊
              </span>

              <span class="bottom-nav-label">
                  统计
              </span>

          </a></nav>



     <!-- =====================================================
     底部
     ====================================================== -->

     <div class="footer">

          私人哑铃增肌 / 塑形训练系统

     </div>



     <!-- =====================================================
     JavaScript
     ====================================================== -->

     <script src="js/config.js"></script>

     <script src="js/loading.js"></script>

     <script src="js/api.js"></script>

     <script src="js/v4-core.js"></script>

     <script src="js/plan.js"></script>

     <!-- 图表 -->

     <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

     <script src="js/settings.js"></script>

     <script src="js/ai-plan.js"></script>

     <script src="js/app.js"></script>


</body>

</html>
